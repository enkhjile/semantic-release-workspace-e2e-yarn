name: alpha7-consumer-acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - node: "24.22.1"
            npm: "12.2.1"
            linker: "pnp"
            suite: "full"
          - node: "24.22.1"
            npm: "12.2.1"
            linker: "node-modules"
            suite: "full"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: |
          mkdir -p "$RUNNER_TEMP/alpha7-config"
          touch "$RUNNER_TEMP/alpha7-config/user" "$RUNNER_TEMP/alpha7-config/global"
          echo "npm_config_userconfig=$RUNNER_TEMP/alpha7-config/user" >> "$GITHUB_ENV"
          echo "npm_config_globalconfig=$RUNNER_TEMP/alpha7-config/global" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_NPM_PATH=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
          npm_config_userconfig="$RUNNER_TEMP/alpha7-config/user" npm_config_globalconfig="$RUNNER_TEMP/alpha7-config/global" npm install --global npm@${{ matrix.npm }}
      - run: |
          npm install --global --force @yarnpkg/cli-dist@4.18.1
          yarn install --immutable
      - run: yarn exec node scripts/public-binding.mjs
      - run: yarn run build
      - run: node --test scripts/consumer.test.mjs
      - name: Record native executable paths and versions
        run: |
          mkdir -p evidence
          touch evidence/install-userconfig evidence/install-globalconfig
          node --version > evidence/native-tools.txt
          command -v npm >> evidence/native-tools.txt
          npm --version >> evidence/native-tools.txt
          command -v yarn >> evidence/native-tools.txt
          yarn --version >> evidence/native-tools.txt
          echo "ACCEPTANCE_NPM_PATH=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
      - name: Public package name and native packaging acceptance
        run: |
          if [[ "${{ matrix.suite }}" == compatibility ]]; then
            export ACCEPTANCE_SCENARIOS=settings-omitted-defaults-native,settings-literal-conventional-preset-config,settings-inferred-manager-native,settings-true-diverged-main-alpha-cycle
          fi
          node scripts/acceptance.mjs
        env:
          ACCEPTANCE_EVIDENCE: evidence/${{ matrix.node }}-npm${{ matrix.npm }}-${{ matrix.linker }}
          ACCEPTANCE_LINKER: ${{ matrix.linker }}
          ACCEPTANCE_EXPECT_NPM: ${{ matrix.npm }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: yarn-alpha7-${{ matrix.node }}-npm${{ matrix.npm }}-${{ matrix.linker }}
          path: evidence/
      - name: Remove generated native installation and caches
        if: always()
        run: |
          rm -rf node_modules .pnp.cjs .pnp.loader.mjs .yarn .scratch "$RUNNER_TEMP/alpha7-config"
          find evidence -type d \( -name npm-cache -o -name downstream \) -prune -exec rm -rf {} +
          rm -f evidence/native-userconfig evidence/native-globalconfig evidence/install-userconfig evidence/install-globalconfig
