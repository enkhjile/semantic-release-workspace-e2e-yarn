name: alpha6-settings-consumer-acceptance
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: workspace-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - node: "24.22.1"
            npm: "12.2.1"
            linker: "pnp"
            suite: "full"
          - node: "24.22.1"
            npm: "12.2.1"
            linker: "node-modules"
            suite: "full"
          - node: "24.11.0"
            npm: "11.21.1"
            linker: "pnp"
            suite: "compatibility"
          - node: "26.12.1"
            npm: "12.2.1"
            linker: "pnp"
            suite: "compatibility"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global npm@${{ matrix.npm }}
      - run: |
          npm install --global --force @yarnpkg/cli-dist@4.18.1
          yarn install --immutable
      - run: yarn run build
      - run: node --test scripts/consumer.test.mjs
      - name: Record native executable paths and versions
        run: |
          mkdir -p evidence
          node --version > evidence/native-tools.txt
          command -v npm >> evidence/native-tools.txt
          npm --version >> evidence/native-tools.txt
          command -v yarn >> evidence/native-tools.txt
          yarn --version >> evidence/native-tools.txt
          echo "ACCEPTANCE_NPM_PATH=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
      - name: Public package name and native packaging acceptance
        run: |
          if [[ "${{ matrix.suite }}" == compatibility ]]; then
            export ACCEPTANCE_SCENARIOS=settings-omitted-defaults-native,settings-literal-conventional-preset-config,settings-inferred-manager-native,settings-true-diverged-main-alpha-cycle
          fi
          node scripts/acceptance.mjs
        env:
          ACCEPTANCE_EVIDENCE: evidence/${{ matrix.node }}-npm${{ matrix.npm }}-${{ matrix.linker }}
          ACCEPTANCE_LINKER: ${{ matrix.linker }}
          ACCEPTANCE_EXPECT_NPM: ${{ matrix.npm }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: yarn-alpha6-settings-${{ matrix.node }}-npm${{ matrix.npm }}-${{ matrix.linker }}
          path: evidence/
