name: Shared workspace native checks
on:
  pull_request:
    branches: [alpha]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YARN_ENABLE_GLOBAL_CACHE: 'false'
    steps:
      - name: Set job-owned cache paths
        run: |
          printf '%s\n' "npm_config_cache=$RUNNER_TEMP/shared-version-npm-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 pnpm@12.15.0 @yarnpkg/cli-dist@4.18.1 --force
      - run: echo "ACCEPTANCE_NPM_CLI=$(readlink -f "$(command -v npm)")" >> "$GITHUB_ENV"
      - run: yarn install --immutable
      - run: yarn test
      - if: always()
        run: rm -rf node_modules .yarn .pnp.cjs .pnp.loader.mjs vendor/shared-version-candidate.tgz "$RUNNER_TEMP/shared-version-candidate-source" "$RUNNER_TEMP/shared-version-pnpm-store" "$RUNNER_TEMP/shared-version-npm-cache"
