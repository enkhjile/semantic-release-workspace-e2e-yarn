name: Alpha.7 push-triggered OIDC preview
on:
  push:
    branches: [alpha, main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: workspace-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  preview:
    environment: public-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm install --global --force @yarnpkg/cli-dist@4.18.1
      - name: Use empty npm authentication configuration
        run: |
          mkdir -p "$RUNNER_TEMP/live-alpha7-config"
          touch "$RUNNER_TEMP/live-alpha7-config/user" "$RUNNER_TEMP/live-alpha7-config/global"
          echo "npm_config_userconfig=$RUNNER_TEMP/live-alpha7-config/user" >> "$GITHUB_ENV"
          echo "npm_config_globalconfig=$RUNNER_TEMP/live-alpha7-config/global" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_NPM_PATH=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
      - run: yarn install --immutable
      - run: node scripts/live-inventory.mjs
      - run: yarn exec node scripts/public-binding.mjs
      - run: node --test scripts/registry-read.test.mjs
      - name: Real push-source dry-run with publication disabled by CLI
        run: node scripts/live-alpha7-preview.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: live-alpha7-yarn-preview-${{ github.sha }}
          path: |
            evidence/live-alpha7-preview/
            evidence/public-alpha7/
      - name: Remove generated installation and configuration
        if: always()
        run: rm -rf .yarn .pnp.cjs .pnp.loader.mjs "$RUNNER_TEMP/live-alpha7-config"
