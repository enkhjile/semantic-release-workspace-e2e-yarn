name: DIAGNOSTIC_LIVE_OIDC
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: write
  id-token: write
concurrency:
  group: workspace-release
  cancel-in-progress: false
jobs:
  diagnostic-live-oidc:
    if: github.ref == 'refs/heads/alpha'
    environment: public-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - run: npm install --global npm@11.21.1
      - run: |
          npm install --global --force @yarnpkg/cli-dist@4.18.1
          yarn install --immutable
      - name: Assert exactly the two approved public packages
        run: node scripts/live-inventory.mjs
      - name: Record pinned native npm binary
        run: echo "DIAGNOSTIC_NPM_BIN=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
      - run: mkdir -p evidence
      - name: Record bootstrap baseline
        run: node scripts/live-proof.mjs baseline
      - name: Required OIDC and provenance preview
        run: yarn exec semantic-release --dry-run 2>&1 | tee evidence/live-dry-run.log
      - name: DIAGNOSTIC_LIVE_OIDC public ESM resolution plus npm11 packaging
        run: yarn exec semantic-release 2>&1 | tee evidence/live-release.log
      - run: node scripts/live-proof.mjs released
      - name: No-change live rerun
        run: yarn exec semantic-release 2>&1 | tee evidence/live-no-change.log
      - run: node scripts/live-proof.mjs rerun
      - run: git ls-remote --refs origin > evidence/live-remote-refs.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: diagnostic-live-oidc-yarn
          path: evidence/
