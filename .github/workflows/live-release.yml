name: DIAGNOSTIC_NPM_EXCHANGE_ONLY
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
  id-token: write
concurrency:
  group: workspace-release
  cancel-in-progress: false
jobs:
  exchange-only:
    if: github.ref == 'refs/heads/oidc-control'
    environment: public-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - run: npm install --global npm@11.21.1
      - name: Official npm11 SDK exchange only; never upload
        run: node scripts/oidc-exchange-control.mjs
        env:
          CONTROL_MANAGER: yarn
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: exchange-only-yarn
          path: evidence/
