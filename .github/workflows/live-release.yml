name: PUBLISHED_ALPHA3_LIVE_OIDC
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: write
  id-token: write
concurrency:
  group: workspace-release
  cancel-in-progress: false
jobs:
  bounded-live-oidc:
    if: github.ref == 'refs/heads/alpha3'
    environment: public-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - run: npm install --global npm@12.2.1
      - run: |
          npm install --global --force @yarnpkg/cli-dist@4.18.1
          yarn install --immutable
      - name: Exact approved inventory and actual tools
        run: |
          mkdir -p evidence
          node scripts/live-inventory.mjs | tee evidence/live-inventory.txt
          node --version > evidence/native-tools.txt
          command -v npm >> evidence/native-tools.txt
          npm --version >> evidence/native-tools.txt
          command -v yarn >> evidence/native-tools.txt
          yarn --version >> evidence/native-tools.txt
          echo "ACCEPTANCE_NPM_PATH=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
      - run: node --test scripts/registry-read.test.mjs scripts/network-count.test.mjs scripts/live-plan.test.mjs
      - run: node scripts/live-guard.mjs before
      - name: Read-only exact-version preview
        run: yarn exec semantic-release --dry-run 2>&1 | tee evidence/live-dry-run.log
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/network-count.mjs
          SRW_HTTP_AUDIT: ${{ github.workspace }}/evidence/dryrun-http.jsonl
      - run: node scripts/live-guard.mjs preview
      - name: Bounded two-version OIDC publication
        continue-on-error: true
        run: yarn exec semantic-release 2>&1 | tee evidence/live-release.log
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/network-count.mjs
          SRW_HTTP_AUDIT: ${{ github.workspace }}/evidence/release-http.jsonl
      - name: Ordinary fresh checkout for exact-source recovery
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          path: fresh
      - name: Recover only unfinished packages from retained remote refs
        working-directory: fresh
        run: |
          git for-each-ref --format='%(refname) %(objectname)' refs/notes refs/semantic-release-workspace > ../evidence/fresh-initial-refs.txt
          NODE_OPTIONS= SRW_HTTP_AUDIT= yarn install --immutable
          completed=false
          for attempt in 1 2 3; do
            if yarn exec semantic-release 2>&1 | tee ../evidence/live-fresh-retry-$attempt.log; then
              completed=true
              break
            fi
            if [[ "$attempt" != 3 ]]; then sleep 30; fi
          done
          [[ "$completed" == true ]]
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/fresh/scripts/network-count.mjs
          SRW_HTTP_AUDIT: ${{ github.workspace }}/evidence/recovery-http.jsonl
      - name: Verify published checksums, source-bound provenance, and native consumption
        working-directory: fresh
        run: |
          mkdir -p evidence
          node scripts/live-proof.mjs released
          node scripts/live-guard.mjs released
        env:
          SRW_GUARD_DIRECTORY: ../evidence
      - name: Second ordinary fresh checkout for no-change proof
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          path: fresh-nochange
      - name: No-change retry cannot upload or request identity
        working-directory: fresh-nochange
        run: |
          git for-each-ref --format='%(refname) %(objectname)' refs/notes refs/semantic-release-workspace > ../evidence/nochange-initial-refs.txt
          NODE_OPTIONS= SRW_HTTP_AUDIT= yarn install --immutable
          yarn exec semantic-release 2>&1 | tee ../evidence/live-fresh-no-change.log
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/fresh-nochange/scripts/network-count.mjs
          SRW_HTTP_AUDIT: ${{ github.workspace }}/evidence/rerun-http.jsonl
      - name: Fresh-clone zero-write guard
        working-directory: fresh-nochange
        run: node scripts/live-guard.mjs rerun
        env:
          SRW_GUARD_DIRECTORY: ../evidence
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: published-alpha3-live-oidc-yarn
          path: |
            evidence/
            fresh/evidence/
