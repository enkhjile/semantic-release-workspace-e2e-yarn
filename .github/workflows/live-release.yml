name: Public release
on:
  push:
    branches: [alpha7-live, stable7-live]
permissions:
  contents: write
  id-token: write
concurrency:
  group: workspace-release
  cancel-in-progress: false
jobs:
  release:
    environment: public-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 @yarnpkg/cli-dist@4.18.1 --force
      - run: echo "ACCEPTANCE_NPM_PATH=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
      - run: yarn install --immutable
      - run: yarn exec node scripts/live-cycle-alpha8.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: alpha8-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/live-alpha8-cycle/
          include-hidden-files: true
