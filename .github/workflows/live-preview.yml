name: PUBLISHED_ALPHA4_APP_ONLY_PREVIEW
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: write
  id-token: write
concurrency:
  group: workspace-release
  cancel-in-progress: false
jobs:
  bounded-live-oidc:
    if: github.ref == 'refs/heads/alpha4-live'
    environment: public-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - run: npm install --global npm@12.2.1
      - run: |
          npm install --global --force @yarnpkg/cli-dist@4.18.1
          yarn install --immutable
      - name: Exact approved app, existing core and actual tools
        run: |
          mkdir -p evidence
          node scripts/live-inventory.mjs | tee evidence/live-inventory.txt
          node --version > evidence/native-tools.txt
          command -v npm >> evidence/native-tools.txt
          npm --version >> evidence/native-tools.txt
          command -v yarn >> evidence/native-tools.txt
          yarn --version >> evidence/native-tools.txt
          echo "ACCEPTANCE_NPM_PATH=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
      - run: node --test scripts/registry-read.test.mjs scripts/network-count.test.mjs scripts/live-plan.test.mjs
      - run: node scripts/live-proof.mjs baseline
      - run: node scripts/live-guard.mjs before
      - name: Read-only exact one-package preview
        run: yarn exec semantic-release --dry-run 2>&1 | tee evidence/live-dry-run.log
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/network-count.mjs
          SRW_HTTP_AUDIT: ${{ github.workspace }}/evidence/dryrun-http.jsonl
      - run: node scripts/live-guard.mjs preview
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: alpha4-app-only-preview-yarn
          path: evidence/
